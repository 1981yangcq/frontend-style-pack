<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>页面不存在 · 前端设计风格大全</title>
<style>
  body{margin:0;background:#fbfbf8;color:#15150f;
    font:16px/1.7 "PingFang SC",system-ui,-apple-system,sans-serif;
    display:grid;place-items:center;min-height:100vh}
  .box{text-align:center;padding:0 24px;max-width:520px}
  .code{font:200 96px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:-.03em}
  h1{font-size:22px;margin:18px 0 8px}
  p{color:#6d6d63;margin:0 0 26px;font-size:14px}
  a{display:inline-block;padding:11px 22px;border-radius:8px;background:#15150f;color:#fff;
    text-decoration:none;font-size:14px}
  a:hover{background:#1d4ed8}
</style></head>
<body><div class="box">
  <div class="code">404</div>
  <h1>这个页面不存在</h1>
  <p>可能是链接过期，或者文件名里的大小写不一致。回到速查表重新挑一个吧。</p>
  <a href="/frontend-style-pack/">← 返回速查表</a>
</div></body></html>
