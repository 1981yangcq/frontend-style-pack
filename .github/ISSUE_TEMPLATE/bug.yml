name: 风格有问题
description: 某个风格的页面渲染不对 / 规格写错了
title: "[问题] "
labels: ["bug"]
body:
  - type: input
    id: which
    attributes:
      label: 哪个风格（编号或名称）
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 哪里不对
      placeholder: 28 号页面在手机上表格横向溢出了
    validations:
      required: true
