name: Release style packs

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python build_demos.py && python build_zips.py
      - name: Bundle all styles
        run: |
          mkdir -p dist
          cp assets/zips/*.zip dist/
          zip -q -r dist/all-styles.zip demos specs styles-bundle.md styles-bundle.json
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
          body: |
            前端设计风格大全 · 风格包

            - `style-XX-*.zip`：单个风格包（demo + 105 组件 + 规格卡 + 现成 CSS + 给 AI 的话）
            - `all-styles.zip`：全部风格 + 规格卡 + AI 投喂包
