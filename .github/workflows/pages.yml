name: Deploy site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage site
        run: |
          mkdir -p _site
          cp -R index.html previews.html demos assets specs i18n docs styles-bundle.md styles-bundle.json README.md _site/
          rm -rf _site/assets/zips _site/assets/zipimg
          # 线上导出按钮指向 Releases（zip 不进仓库）
          REL="https://github.com/${{ github.repository }}/releases/latest/download"
          grep -rl 'assets/zips/style-' _site | xargs -r sed -i "s#\(\.\./\)\?assets/zips/style-#$REL/style-#g"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
